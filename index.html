<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Matrix Calculator</title>
  </head>
  <body>
    <div id="app">
      <div class="top-bar">
        <div>
          <h1>Matrix calculator</h1>
          <div class="shortcut-row">
            <span class="shortcut-hint"
              ><span class="kbd">↑↓←→</span> navigate cells</span
            >
            <span class="shortcut-hint"
              ><span class="kbd">Enter</span> compute</span
            >
            <span class="shortcut-hint"><span class="kbd">R</span> reset</span>
            <span class="shortcut-hint"
              ><span class="kbd">Ctrl+C</span> copy result</span
            >
          </div>
        </div>
        <div class="top-actions">
          <button class="dark-toggle" id="darkToggle" onclick="toggleDark()">
            dark mode
          </button>
        </div>
      </div>

      <div class="workspace" id="workspace">
        <div class="matrix-card" id="cardA">
          <div class="card-header">
            <div class="card-label">
              <span class="label-badge">A</span>
              Matrix A
            </div>
            <div class="quick-actions">
              <button class="btn-sm" onclick="randomFill('A')">random</button>
              <button class="btn-sm" onclick="identityFill('A')">
                identity
              </button>
              <button class="btn-sm" onclick="clearMatrix('A')">clear</button>
            </div>
          </div>
          <div class="size-controls">
            <label>rows</label>
            <select
              class="size-select"
              id="rowsA"
              onchange="rebuildMatrix('A')"
            >
              <option value="2" selected>2</option>
              <option value="3">3</option>
              <option value="4">4</option>
              <option value="5">5</option>
            </select>
            <label>cols</label>
            <select
              class="size-select"
              id="colsA"
              onchange="rebuildMatrix('A')"
            >
              <option value="2" selected>2</option>
              <option value="3">3</option>
              <option value="4">4</option>
              <option value="5">5</option>
            </select>
          </div>
          <div class="matrix-grid-wrap" style="padding: 0 12px">
            <div class="matrix-grid" id="gridA"></div>
          </div>
        </div>

        <div class="matrix-card" id="cardB">
          <div class="card-header">
            <div class="card-label">
              <span class="label-badge b">B</span>
              Matrix B
            </div>
            <div class="quick-actions">
              <button class="btn-sm" onclick="randomFill('B')">random</button>
              <button class="btn-sm" onclick="identityFill('B')">
                identity
              </button>
              <button class="btn-sm" onclick="clearMatrix('B')">clear</button>
            </div>
          </div>
          <div class="size-controls">
            <label>rows</label>
            <select
              class="size-select"
              id="rowsB"
              onchange="rebuildMatrix('B')"
            >
              <option value="2" selected>2</option>
              <option value="3">3</option>
              <option value="4">4</option>
              <option value="5">5</option>
            </select>
            <label>cols</label>
            <select
              class="size-select"
              id="colsB"
              onchange="rebuildMatrix('B')"
            >
              <option value="2" selected>2</option>
              <option value="3">3</option>
              <option value="4">4</option>
              <option value="5">5</option>
            </select>
          </div>
          <div class="matrix-grid-wrap" style="padding: 0 12px">
            <div class="matrix-grid" id="gridB"></div>
          </div>
        </div>
      </div>

      <div class="op-row">
        <select class="op-select" id="opSelect" onchange="onOpChange()">
          <option value="multiply">A × B — multiply</option>
          <option value="add">A + B — add</option>
          <option value="subtract">A − B — subtract</option>
          <option value="transpose">Aᵀ — transpose A</option>
          <option value="determinant">det(A) — determinant</option>
          <option value="inverse">A⁻¹ — inverse</option>
          <option value="scalar">k × A — scalar multiply</option>
          <option value="power">Aⁿ — matrix power</option>
        </select>

        <div class="scalar-input-wrap" id="scalarWrap" style="display: none">
          <label for="scalarK">k =</label>
          <input
            type="number"
            class="scalar-input"
            id="scalarK"
            value="2"
            placeholder="k"
          />
        </div>
        <div class="scalar-input-wrap" id="powerWrap" style="display: none">
          <label for="powerN">n =</label>
          <input
            type="number"
            class="scalar-input"
            id="powerN"
            value="2"
            placeholder="n"
            min="0"
            max="10"
          />
        </div>

        <button class="compute-btn" id="computeBtn" onclick="compute()">
          <div class="spinner"></div>
          <span class="btn-text">compute</span>
        </button>
        <button class="reset-btn" onclick="resetAll()">reset</button>
      </div>

      <div class="status-bar" id="statusBar"></div>
      <div class="error-card" id="errorCard">
        <div class="error-title" id="errorTitle">Dimension mismatch</div>
        <div class="error-msg" id="errorMsg"></div>
      </div>

      <div class="result-section" id="resultSection">
        <div class="result-card">
          <div class="result-header">
            <div>
              <div class="result-title">Result</div>
              <div class="result-op" id="resultOp"></div>
            </div>
            <div class="result-actions">
              <button class="export-btn" id="copyBtn" onclick="copyResult()">
                copy
              </button>
              <button class="export-btn" onclick="downloadJSON()">json</button>
              <button class="export-btn" onclick="downloadText()">text</button>
            </div>
          </div>
          <div class="hint-box" id="hoverHint" style="display: none">
            hover a result cell to highlight source rows/cols
          </div>
          <div class="result-body">
            <div class="result-matrix-wrap">
              <div class="result-matrix">
                <div class="result-grid" id="resultGrid"></div>
              </div>
              <div
                style="
                  font-size: 11px;
                  color: var(--color-text-secondary);
                  margin-top: 6px;
                "
                id="resultDimLabel"
              ></div>
            </div>
            <div class="steps-panel" id="stepsPanel"></div>
          </div>
        </div>
      </div>

      <div class="history-section" id="historySection" style="display: none">
        <div class="history-header" onclick="toggleHistory()">
          <span class="history-toggle-label">recent calculations</span>
          <span class="history-arrow" id="histArrow">▼</span>
        </div>
        <div class="history-list" id="historyList"></div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
